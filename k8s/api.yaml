apiVersion: apps/v1
kind: Deployment
metadata: { name: api }
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: skinet-api:1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - name: ConnectionStrings__DefaultConnection
              value: "Server=sql,1433;Database=skinet;User Id=sa;Password=Password@1;TrustServerCertificate=True"
            - name: ConnectionStrings__Redis
              value: "redis:6379"
---
apiVersion: v1
kind: Service
metadata: { name: api }
spec:
  selector: { app: api }
  ports: [{ port: 80, targetPort: 8080 }]
