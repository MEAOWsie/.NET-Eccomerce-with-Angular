apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: skinet-gateway:1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /gateway/health, port: 8080 }
---
apiVersion: v1
kind: Service
metadata: { name: gateway }
spec:
  type: NodePort
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 8080 }]
