apiVersion: apps/v1
kind: Deployment
metadata: { name: sql }
spec:
  replicas: 1
  selector: { matchLabels: { app: sql } }
  template:
    metadata: { labels: { app: sql } }
    spec:
      containers:
        - name: sql
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports: [{ containerPort: 1433 }]
          env:
            - { name: ACCEPT_EULA, value: "Y" }
            - { name: MSSQL_SA_PASSWORD, value: "Password@1" }
          resources:
            requests: { memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata: { name: sql }
spec:
  selector: { app: sql }
  ports: [{ port: 1433 }]
